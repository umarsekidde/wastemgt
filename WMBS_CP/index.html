<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMBS - Waste Management & Billing System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F4C81 0%, #1DB954 100%);
      color: #fff;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.95);
      color: #1a1a1a;
      padding: 2rem;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #0F4C81; }
    /* Icon Style */
    .main-icon { font-size: 3rem; color: #1DB954; margin-bottom: 1rem; }
    p { font-size: 0.95rem; line-height: 1.5; margin-bottom: 1rem; color: #555; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px; /* Space between icon and text */
      padding: 14px 24px;
      background: linear-gradient(45deg, #0F4C81, #1DB954);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      margin-top: 1rem;
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <i class="fa-solid fa-recycle main-icon"></i>
    <h1>WMBS</h1>
    
    <div class="status-tag">
      <i class="fa-solid fa-circle-check"></i> System Live on Render
    </div>

    <p>Waste Management & Billing System</p>
    <p>Your Node.js environment and <strong>PostgreSQL</strong> database are now configured.</p>
    
    <a href="/auth/login" class="btn">
      <i class="fa-solid fa-right-to-bracket"></i> Go to Login
    </a>

    <a href="/map" class="btn" style="background: #333;">
      <i class="fa-solid fa-map-location-dot"></i> Open GPS Tracker
    </a>
  </div>
</body>
</html>
